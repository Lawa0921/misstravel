name: Refresh verification lockfile

on:
  push:
    branches:
      - verify/vercel-preview-20260807
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Refresh package lock') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: verify/vercel-preview-20260807

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Refresh package lock
        working-directory: astro-site
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- astro-site/package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astro-site/package-lock.json
          git commit -m "Refresh package lock for verification"
          git push origin HEAD:verify/vercel-preview-20260807
