name: Media Audit

on:
  pull_request:
    paths:
      - 'astro-site/scripts/media-audit.mjs'
      - '.github/workflows/media-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Audit current media and Git history
        run: node astro-site/scripts/media-audit.mjs
