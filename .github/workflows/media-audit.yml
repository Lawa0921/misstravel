name: Media Audit

on:
  pull_request:
    paths:
      - 'astro-site/scripts/media-audit.mjs'
      - 'astro-site/scripts/performance-audit.mjs'
      - '.github/workflows/media-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Audit current media and Git history
        run: node astro-site/scripts/media-audit.mjs

      - name: Install site dependencies
        working-directory: astro-site
        run: npm ci

      - name: Install Chromium
        working-directory: astro-site
        run: npx playwright install --with-deps chromium

      - name: Build site
        working-directory: astro-site
        run: npm run build

      - name: Measure representative page resources
        run: node astro-site/scripts/performance-audit.mjs
