name: Production Browser Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-production-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against production
        run: npx playwright test --config=playwright.production.config.ts
        env:
          ASTRO_TELEMETRY_DISABLED: 1
