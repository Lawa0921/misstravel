name: Preview Live Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose deployed Vercel Preview response
        env:
          PREVIEW_ORIGIN: https://misstravel-git-verify-verce-f42643-bag571ivy3470-1104s-projects.vercel.app
        run: |
          node <<'NODE'
          const response = await fetch(`${process.env.PREVIEW_ORIGIN}/`, {
            redirect: 'follow',
            headers: { 'cache-control': 'no-cache', 'user-agent': 'misstravel-preview-smoke/1.0' },
          });
          const html = await response.text();
          const title = html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]?.replace(/\s+/g, ' ').trim() || '(no title)';
          console.log(`status=${response.status}`);
          console.log(`finalUrl=${response.url}`);
          console.log(`contentType=${response.headers.get('content-type') || ''}`);
          console.log(`server=${response.headers.get('server') || ''}`);
          console.log(`xVercelId=${response.headers.get('x-vercel-id') || ''}`);
          console.log(`title=${title}`);
          console.log('bodyStart=' + html.slice(0, 1200).replace(/\s+/g, ' '));
          if (html.includes('查詢空房')) {
            console.log('✓ response is the actual MissTravel site');
          } else {
            throw new Error('Preview URL returned HTTP 200 but not the MissTravel homepage');
          }
          NODE
