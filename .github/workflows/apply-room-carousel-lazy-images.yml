name: Apply Room Carousel Lazy Images

on:
  pull_request:
    paths:
      - '.github/workflows/apply-room-carousel-lazy-images.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Apply lazy loading and E2E regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('astro-site/src/pages/rooms/[...slug].astro')
          page = page_path.read_text(encoding='utf-8')

          old_image = '''                <img
                  src={image}
                  alt={`${room.data.shortTitle} 圖片 ${index + 1}`}
                  loading={index === 0 ? 'eager' : 'lazy'}
                  decoding="async"
                  fetchpriority={index === 0 ? 'high' : undefined}
                  width="900"
                  height="675"
                />'''
          new_image = '''                <img
                  src={index < 2 ? image : undefined}
                  data-src={index < 2 ? undefined : image}
                  alt={`${room.data.shortTitle} 圖片 ${index + 1}`}
                  loading={index === 0 ? 'eager' : 'lazy'}
                  decoding="async"
                  fetchpriority={index === 0 ? 'high' : undefined}
                  width="900"
                  height="675"
                />'''
          if old_image not in page:
              raise SystemExit('room carousel image block not found')
          page = page.replace(old_image, new_image, 1)

          old_script = '''<script>
  const carousel = document.getElementById('room-carousel');
  if (carousel) {
    const track = carousel.querySelector('.carousel-track') as HTMLElement;
    const slides = carousel.querySelectorAll('.carousel-slide');
    const dots = carousel.querySelectorAll('.dot');
    const prevBtn = carousel.querySelector('.prev');
    const nextBtn = carousel.querySelector('.next');
    let currentIndex = 0;

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    prevBtn?.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      updateCarousel();
    });

    nextBtn?.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % slides.length;
      updateCarousel();
    });

    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => {
        currentIndex = i;
        updateCarousel();
      });
    });

    // Touch support
    let touchStartX = 0;
    track.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    });

    track.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          currentIndex = (currentIndex + 1) % slides.length;
        } else {
          currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        }
        updateCarousel();
      }
    });
  }
</script>'''
          new_script = '''<script>
  const carousel = document.getElementById('room-carousel');
  if (carousel) {
    const track = carousel.querySelector('.carousel-track') as HTMLElement;
    const slides = carousel.querySelectorAll('.carousel-slide');
    const slideImages = Array.from(carousel.querySelectorAll<HTMLImageElement>('.carousel-slide img'));
    const dots = carousel.querySelectorAll('.dot');
    const prevBtn = carousel.querySelector('.prev');
    const nextBtn = carousel.querySelector('.next');
    let currentIndex = 0;
    let navigationToken = 0;

    function normalizeIndex(index: number) {
      return (index + slides.length) % slides.length;
    }

    function prepareImage(index: number) {
      const image = slideImages[normalizeIndex(index)];
      const deferredSrc = image?.dataset.src;
      if (image && deferredSrc) {
        image.loading = 'eager';
        image.src = deferredSrc;
        delete image.dataset.src;
      }
      return image;
    }

    async function waitForImage(image?: HTMLImageElement) {
      if (!image || image.complete) return;
      try {
        await image.decode();
      } catch {
        await new Promise<void>((resolve) => {
          image.addEventListener('load', () => resolve(), { once: true });
          image.addEventListener('error', () => resolve(), { once: true });
        });
      }
    }

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function preloadNeighbors() {
      prepareImage(currentIndex + 1);
      prepareImage(currentIndex - 1);
    }

    async function navigateTo(index: number) {
      const targetIndex = normalizeIndex(index);
      const token = ++navigationToken;
      const targetImage = prepareImage(targetIndex);
      await waitForImage(targetImage);
      if (token !== navigationToken) return;
      currentIndex = targetIndex;
      updateCarousel();
      preloadNeighbors();
    }

    prevBtn?.addEventListener('pointerenter', () => prepareImage(currentIndex - 1));
    prevBtn?.addEventListener('focus', () => prepareImage(currentIndex - 1));
    prevBtn?.addEventListener('click', () => void navigateTo(currentIndex - 1));

    nextBtn?.addEventListener('pointerenter', () => prepareImage(currentIndex + 1));
    nextBtn?.addEventListener('focus', () => prepareImage(currentIndex + 1));
    nextBtn?.addEventListener('click', () => void navigateTo(currentIndex + 1));

    dots.forEach((dot, i) => {
      dot.addEventListener('pointerenter', () => prepareImage(i));
      dot.addEventListener('focus', () => prepareImage(i));
      dot.addEventListener('click', () => void navigateTo(i));
    });

    let touchStartX = 0;
    track.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      prepareImage(currentIndex + 1);
      prepareImage(currentIndex - 1);
    });

    track.addEventListener('touchend', (e) => {
      const diff = touchStartX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        void navigateTo(diff > 0 ? currentIndex + 1 : currentIndex - 1);
      }
    });
  }
</script>'''
          if old_script not in page:
              raise SystemExit('room carousel script block not found')
          page = page.replace(old_script, new_script, 1)
          page_path.write_text(page, encoding='utf-8')

          test_path = Path('astro-site/tests/e2e/interaction.spec.ts')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''test('房型輪播應同步目前投影片 ARIA 狀態並支援方向鍵', async ({ page }) => {
  await page.goto('/rooms/campsite_1/');

  const carousel = page.locator('#room-carousel');
  const dots = carousel.locator('.dot');
  const next = carousel.locator('.next');

  await expect(carousel).toHaveAttribute('role', 'region');
  await expect(dots.first()).toHaveAttribute('aria-current', 'true');

  await next.click();
  await expect(dots.nth(1)).toHaveAttribute('aria-current', 'true');

  await next.focus();
  await page.keyboard.press('ArrowLeft');
  await expect(dots.first()).toHaveAttribute('aria-current', 'true');
});'''
          new_test = '''test('房型輪播應延後非相鄰圖片請求並維持 ARIA 與鍵盤操作', async ({ page }) => {
  const requestedImages: string[] = [];
  page.on('request', (request) => {
    const url = new URL(request.url());
    if (url.pathname.startsWith('/images/log_cabin_4/')) requestedImages.push(url.pathname);
  });

  await page.goto('/rooms/log_cabin_4/');

  const carousel = page.locator('#room-carousel');
  const dots = carousel.locator('.dot');
  const images = carousel.locator('.carousel-slide img');
  const next = carousel.locator('.next');
  const deferredImage = '/images/log_cabin_4/log_cabin_4_1.webp';

  await expect(carousel).toHaveAttribute('role', 'region');
  await expect(dots.first()).toHaveAttribute('aria-current', 'true');
  await expect(images.nth(2)).toHaveAttribute('data-src', deferredImage);
  expect(await images.nth(2).getAttribute('src')).toBeNull();
  expect(requestedImages).not.toContain(deferredImage);

  await next.click();
  await expect(dots.nth(1)).toHaveAttribute('aria-current', 'true');
  await expect(images.nth(2)).toHaveAttribute('src', deferredImage);
  await expect.poll(() => requestedImages.includes(deferredImage)).toBe(true);

  await next.focus();
  await page.keyboard.press('ArrowLeft');
  await expect(dots.first()).toHaveAttribute('aria-current', 'true');
});'''
          if old_test not in test:
              raise SystemExit('room carousel E2E block not found')
          test = test.replace(old_test, new_test, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit result
        run: |
          git rm .github/workflows/apply-room-carousel-lazy-images.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add astro-site/src/pages/rooms/'[...slug].astro' astro-site/tests/e2e/interaction.spec.ts
          git commit -m '延後載入房型輪播非相鄰圖片'
          git push origin HEAD:${GITHUB_HEAD_REF}
