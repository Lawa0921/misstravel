name: Subset Site Font

on:
  pull_request:
    paths:
      - '.github/workflows/subset-site-font.yml'

permissions:
  contents: write

jobs:
  subset:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: astro-site/package-lock.json

      - name: Build current site
        working-directory: astro-site
        run: |
          npm ci
          npm run build

      - name: Install font subsetting tools
        run: python3 -m pip install --user fonttools brotli

      - name: Collect every glyph used by the current site
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path('astro-site/src'),
              Path('astro-site/public/scripts'),
              Path('astro-site/dist'),
          ]
          text_ext = {'.astro', '.ts', '.tsx', '.js', '.mjs', '.json', '.md', '.mdx', '.css', '.html', '.xml', '.svg'}
          chars = set(chr(i) for i in range(32, 127))
          chars.update('\n\r\t\u00a0')
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in text_ext:
                      continue
                  try:
                      chars.update(path.read_text(encoding='utf-8'))
                  except UnicodeDecodeError:
                      pass
          Path('/tmp/site-glyphs.txt').write_text(''.join(sorted(chars)), encoding='utf-8')
          print(f'Collected {len(chars)} unique characters from source and built HTML.')
          PY

      - name: Subset font without changing glyph metrics
        run: |
          cp astro-site/public/fonts/setofont.woff2 /tmp/setofont-full.woff2
          python3 -m fontTools.subset /tmp/setofont-full.woff2 \
            --text-file=/tmp/site-glyphs.txt \
            --output-file=astro-site/public/fonts/setofont.woff2 \
            --flavor=woff2 \
            --retain-gids \
            --layout-features='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --notdef-outline \
            --recommended-glyphs \
            --name-IDs='*' \
            --name-languages='*'

      - name: Verify required glyph coverage and metrics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          full_path = Path('/tmp/setofont-full.woff2')
          subset_path = Path('astro-site/public/fonts/setofont.woff2')
          required = set(Path('/tmp/site-glyphs.txt').read_text(encoding='utf-8'))
          full = TTFont(full_path)
          subset = TTFont(subset_path)
          full_cmap = full.getBestCmap() or {}
          subset_cmap = subset.getBestCmap() or {}
          supported = {ord(ch) for ch in required if ord(ch) in full_cmap}
          missing = sorted(supported - set(subset_cmap))
          if missing:
              raise SystemExit(f'Subset lost {len(missing)} required glyphs: {missing[:20]}')

          mismatched = []
          for codepoint in supported:
              old_name = full_cmap[codepoint]
              new_name = subset_cmap[codepoint]
              if full['hmtx'].metrics.get(old_name) != subset['hmtx'].metrics.get(new_name):
                  mismatched.append(codepoint)
          if mismatched:
              raise SystemExit(f'Subset changed metrics for {len(mismatched)} glyphs: {mismatched[:20]}')

          old_size = full_path.stat().st_size
          new_size = subset_path.stat().st_size
          print(f'Full font: {old_size / 1024 / 1024:.2f} MB')
          print(f'Subset font: {new_size / 1024 / 1024:.2f} MB')
          print(f'Reduction: {(1 - new_size / old_size) * 100:.1f}%')
          if new_size >= 2 * 1024 * 1024:
              raise SystemExit('Subset is still >= 2 MB; do not commit a low-value change.')
          PY

      - name: Commit generated font to audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add astro-site/public/fonts/setofont.woff2
          if git diff --cached --quiet; then
            echo 'No font change generated.'
            exit 0
          fi
          git commit -m '縮減全站字型傳輸量'
          git push origin HEAD:${GITHUB_HEAD_REF}
